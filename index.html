  <style>
    :root{
      --bg:#0b1020; --card:#121a33; --muted:#a9b2d6; --text:#eef2ff;
      --accent:#5eead4; --accent2:#60a5fa; --border:rgba(255,255,255,.10);
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --max: 1050px;
      --pad: 18px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; font-family:var(--font); color:var(--text); background:
      radial-gradient(1200px 800px at 20% 10%, rgba(96,165,250,.18), transparent 55%),
      radial-gradient(900px 700px at 80% 20%, rgba(94,234,212,.16), transparent 55%),
      radial-gradient(900px 700px at 50% 90%, rgba(96,165,250,.10), transparent 55%),
      var(--bg);
      line-height:1.5;
    }
    a{color:inherit; text-decoration:none}
    .wrap{max-width:var(--max); margin:0 auto; padding:28px var(--pad)}
    header{
      position:sticky; top:0; z-index:5;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,16,32,.85), rgba(11,16,32,.55));
      border-bottom:1px solid var(--border);
    }
    .nav{display:flex; align-items:center; justify-content:space-between; gap:16px}
    .brand{display:flex; align-items:center; gap:12px}
    .logo-img{
      width:46px; height:46px; border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 28px rgba(0,0,0,.45);
      background: rgba(255,255,255,.04);
      object-fit: cover;
    }
    .brand h1{font-size:15px; margin:0; letter-spacing:.2px}
    .brand p{margin:0; font-size:12px; color:var(--muted)}
    nav{display:flex; gap:4px; flex-wrap:wrap}
    nav a{
      font-size:13px; color:var(--muted); padding:10px 10px; border-radius:12px;
    }
    nav a:hover{background:rgba(255,255,255,.06); color:var(--text)}
    .cta{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px; padding:11px 14px; border-radius:14px;
      background: linear-gradient(135deg, rgba(94,234,212,.18), rgba(96,165,250,.18));
      border:1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
      font-weight:700; font-size:13px;
      white-space:nowrap;
    }
    .cta:hover{transform: translateY(-1px)}

    .hero{padding:34px 0 12px}
    .grid{display:grid; grid-template-columns: 1.25fr .75fr; gap:18px;}
    @media (max-width: 900px){
      .grid{grid-template-columns:1fr}
      nav{display:none}
      header .cta{margin-left:auto}
    }

    .card{
      background: rgba(18,26,51,.78);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .badge{
      display:inline-flex; gap:8px; align-items:center;
      font-size:12px; color:var(--muted);
      padding:7px 10px; border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
    }
    .badge i{width:8px; height:8px; border-radius:50%; background:var(--accent)}
    h2{margin:12px 0 10px; font-size:34px; line-height:1.15}
    .lead{color:var(--muted); font-size:15px; max-width:60ch}
    .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px; padding:12px 14px; border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      font-weight:700; font-size:13px;
      cursor:pointer;
    }
    .btn:hover{background: rgba(255,255,255,.09)}
    .btn.primary{
      background: linear-gradient(135deg, rgba(94,234,212,.22), rgba(96,165,250,.22));
      border:1px solid rgba(255,255,255,.18);
    }

    .kpi{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    .pill{
      padding:8px 10px; border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.05);
      font-size:12px; color:var(--muted);
    }

    .list{display:grid; gap:10px; margin-top:14px}
    .li{
      display:flex; gap:12px; align-items:flex-start;
      padding:12px; border-radius:16px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      margin-top:6px; flex:0 0 auto;
    }
    .li b{display:block; font-size:13px}
    .li span{display:block; color:var(--muted); font-size:13px}

    .section{padding:18px 0}
    .section h3{margin:0 0 10px; font-size:18px}
    .cols{display:grid; grid-template-columns: repeat(3,1fr); gap:14px}
    @media (max-width: 900px){ .cols{grid-template-columns:1fr} }
    .mini{
      padding:16px; border-radius:18px; border:1px solid var(--border);
      background: rgba(255,255,255,.04);
    }
    .mini h4{margin:0 0 6px; font-size:14px}
    .mini p{margin:0; color:var(--muted); font-size:13px}

    .note{font-size:12px; color:var(--muted)}
    .small{font-size:12px; color:var(--muted); margin-top:8px}

    .two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
    @media (max-width: 900px){ .two{grid-template-columns:1fr} }

    input, textarea{
      width:100%; padding:12px 12px; border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
    }
    textarea{min-height:110px; resize:vertical}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}

    .address{
      margin-top:10px; padding:12px; border-radius:16px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.04);
    }
    .address b{display:block; font-size:13px}
    .address span{display:block; font-size:13px; color:var(--muted)}

    /* ===== CLEAN PROFESSIONAL GALLERY (FEATURED FIRST ROW) ===== */
    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:20px;
      margin-top:20px;
      /* Base row height; featured items span 2 rows */
      grid-auto-rows: 180px;
    }
    @media (max-width: 900px){
      .gallery-grid{ grid-template-columns:1fr; grid-auto-rows: 220px; }
    }
    .gallery-item{
      position:relative;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
      background:#111827;
      height:100%;
      box-shadow: 0 15px 30px rgba(0,0,0,.35);
    }
    .gallery-item.featured{ grid-row: span 2; }
    @media (max-width: 900px){
      .gallery-item.featured{ grid-row: span 1; }
    }
    .gallery-item img{
      width:100%;
      height:100%;
      object-fit: contain;
      transition: transform .4s ease;
      display:block;
    }
    .gallery-item:hover img{ transform: none; }
    .caption{
      position:absolute;
      bottom:0; left:0; right:0;
      padding:14px;
      background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
      color:white;
    }
    .caption b{display:block; font-size:14px}
    .caption span{font-size:12px; opacity:.85}


    footer{
      border-top:1px solid var(--border);
      margin-top:20px; padding:22px 0 10px; color:var(--muted);
      font-size:12px;
    }
    .footbrand{display:flex; align-items:center; gap:10px}
    .footbrand img{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04)}

  opacity:.9;

  margin-bottom:12px;
